[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "1.0.0"
description = "Statistically rigorous A/B testing of ML classifiers on the Dry Bean benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "akhilnathreddy" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
